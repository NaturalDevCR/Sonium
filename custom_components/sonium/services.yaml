rename_client:
  name: Rename Client
  description: Set the display name of a Sonium client speaker.
  fields:
    client_id:
      name: Client ID
      description: The internal ID of the client to rename.
      required: true
      example: "sonium-pi-bedroom-uuid"
      selector:
        text:
    display_name:
      name: Display Name
      description: The new display name for the client.
      required: true
      example: "Bedroom Speaker"
      selector:
        text:

rename_group:
  name: Rename Group
  description: Set the display name of a Sonium group (zone).
  fields:
    group_id:
      name: Group ID
      description: The internal ID of the group to rename.
      required: true
      example: "default"
      selector:
        text:
    name:
      name: Name
      description: The new name for the group.
      required: true
      example: "Living Room"
      selector:
        text:

create_group:
  name: Create Group
  description: Create a new Sonium group and assign it a stream.
  fields:
    name:
      name: Name
      description: The name for the new group.
      required: true
      example: "Garden"
      selector:
        text:
    stream_id:
      name: Stream ID
      description: The ID of the stream to assign to the new group.
      required: true
      example: "default"
      selector:
        text:

delete_group:
  name: Delete Group
  description: >
    Delete a Sonium group. Clients in the group will be moved to the
    default group automatically.
  fields:
    group_id:
      name: Group ID
      description: The internal ID of the group to delete.
      required: true
      example: "garden"
      selector:
        text:

play_announcement:
  name: Play announcement
  description: >
    Schedule a bounded, ducked announcement on one or more Sonium zones. The
    idempotency key must be reused if an automation retries the same request.
  fields:
    source:
      name: Source URI
      description: A reachable http(s) or media URI for the announcement.
      required: true
      example: "https://home.example/local/doorbell.ogg"
      selector:
        text:
    idempotency_key:
      name: Idempotency key
      description: A stable 1–128 byte key for this logical announcement.
      required: true
      example: "front-door-20260901-001"
      selector:
        text:
    group_ids:
      name: Group IDs
      description: Sonium group IDs to receive the announcement.
      selector:
        object:
    target_entity_ids:
      name: Sonium entities
      description: Sonium group or client media-player entity IDs to resolve to zones.
      selector:
        entity:
          filter:
            domain: media_player
          multiple: true
    priority:
      name: Priority
      description: Higher priorities interrupt lower-priority announcements.
      default: announcement
      selector:
        select:
          options:
            - music
            - chime
            - announcement
            - emergency
    attenuation_db:
      name: Duck attenuation
      description: Music attenuation while the announcement plays, from -60 to 0 dB.
      default: -18
      selector:
        number:
          min: -60
          max: 0
          step: 1
          unit_of_measurement: dB
          mode: box
    attack_ms:
      name: Duck attack
      description: Milliseconds to ramp music down, from 0 to 5000.
      default: 25
      selector:
        number:
          min: 0
          max: 5000
          step: 1
          unit_of_measurement: ms
          mode: box
    release_ms:
      name: Duck release
      description: Milliseconds to restore music, from 0 to 5000.
      default: 100
      selector:
        number:
          min: 0
          max: 5000
          step: 1
          unit_of_measurement: ms
          mode: box
    max_duration_ms:
      name: Maximum duration
      description: Hard expiry for the announcement, from 1 to 120000 ms.
      default: 30000
      selector:
        number:
          min: 1
          max: 120000
          step: 1
          unit_of_measurement: ms
          mode: box
    resume:
      name: Resume previous audio
      description: Restore the prior music program once after completion or cancellation.
      default: true
      selector:
        boolean:

cancel_announcement:
  name: Cancel announcement
  description: Cancel a scheduled or active Sonium announcement by its server ID.
  fields:
    announcement_id:
      name: Announcement ID
      description: The ID returned by Sonium after the announcement was created.
      required: true
      selector:
        text:
