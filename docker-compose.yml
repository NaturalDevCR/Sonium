services:
  sonium-server:
    image: sonium/server:latest
    build: .
    ports:
      - "1710:1710"   # TCP audio stream (clients connect here)
      # Control API/UI is host-local by default. Use an SSH tunnel, or change
      # this deliberately and protect it with a host firewall on a trusted LAN.
      - "127.0.0.1:1711:1711"
    volumes:
      - sonium-config:/etc/sonium
      - ./deploy/docker/sonium.toml:/etc/sonium/sonium.toml:ro
    restart: unless-stopped
    # Optional: set log level
    # environment:
    #   - SONIUM_LOG=debug

volumes:
  sonium-config:
    # Stores users.json (password hashes + JWT secret), state, and logs.
