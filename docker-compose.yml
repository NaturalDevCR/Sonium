services:
  sonium-server:
    image: sonium/server:latest
    build: .
    ports:
      - "1710:1710"   # TCP audio stream (clients connect here)
      # Control API/UI is host-local by default. Use an SSH tunnel, or change
      # this deliberately and protect it with a host firewall on a trusted LAN.
      - "127.0.0.1:1711:1711"
    volumes:
      - sonium-config:/etc/sonium
      - ./deploy/docker/sonium.toml:/etc/sonium/sonium.toml:ro
    restart: unless-stopped
    # Optional: set log level
    # environment:
    #   - SONIUM_LOG=debug

  init-admin:
    image: sonium/server:latest
    build: .
    profiles: ["bootstrap"]
    entrypoint: ["/bin/sh", "/opt/sonium/init-admin.sh"]
    environment:
      # Supply this only for `docker compose --profile bootstrap run`; it is
      # intentionally not saved in this file or the server configuration.
      SONIUM_INIT_ADMIN_PASSWORD: "${SONIUM_INIT_ADMIN_PASSWORD-}"
    volumes:
      - sonium-config:/etc/sonium
      - ./deploy/docker/sonium.toml:/etc/sonium/sonium.toml:ro
      - ./deploy/docker/init-admin.sh:/opt/sonium/init-admin.sh:ro

volumes:
  sonium-config:
    # Stores users.json (password hashes + JWT secret), state, and logs.
